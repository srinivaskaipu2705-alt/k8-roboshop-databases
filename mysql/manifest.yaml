#configmap, service, headless service, statefulset, pvc
apiVersion: v1
kind: ConfigMap
metadata:
  name: msql
  namespace: roboshop
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: mysql
    tier: db
  ports:
    - protocol: TCP
      port: 3306 #service port
      targetPort: 3306 #container port
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: roboshop
spec:
  clusterIP: None
  selector:
    project: roboshop
    component: mysql
    tier: db
  ports:
    - protocol: TCP
      port: 3306 #service port
      targetPort: 3306 #container port
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: roboshop
spec:
  selector:
    matchLabels:
      project: roboshop
      component: mysql
      tier: db
  serviceName: "mysql-headless"  #this should be headless service name
  replicas: 2 # by default it will be 1
  template: 
    metadata:
      lables:
        project: roboshop
        component: mysql
        tier: db
    spec:
      containers:
      - name: mysql
        image: joindevops/mysql:v1
        volumeMounts:
        - name: mysql
          mountPath: /data/db
        - name: mysql-config
          mountPath: /etc/mysql/conf.d/my.cnf
          subPath: my.cnf
      volumes:
        - name: mysql-config
          configMap:
            name: msql
  # pvc
  volumeClaimTemplets:
  - metadta : 
      name : mysql
    spec:
      acessModes: [ "ReadWriteOnce" ]
      storageclass: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi

      