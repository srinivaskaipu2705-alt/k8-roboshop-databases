apiVersion: v1
kind: configmap
metadata:
    name: frontend
    namespace: roboshop
data:
    nginx.conf: |
        user nginx;
        worker_processes auto;
        error_log /var/log/nginx/error.log notice;
        pid /run/nginx.pid;

        include /usr/share/nginx/modules/*.conf;

        events {
            worker_connections 1024;
        }

        http {
            log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';

            access_log  /var/log/nginx/access.log  main;

            sendfile            on;
            tcp_nopush          on;
            tcp_nodelay         on;
            keepalive_timeout   65;
            types_hash_max_size 4096;

            include             /etc/nginx/mime.types;
            default_type        application/octet-stream;

            include /etc/nginx/conf.d/*.conf;

            server{
                listen 8080;
                listen [::]:8080;
                server_name _;
                root /usr/share/nginx/html;

                include /etc/nginx/default.d/*.conf;

                error_page 404 /index.html;
                location = /404.html {
                }

                error_page 500 502 503 504 /50x.html;
                location = /50x.html {
                }
                location /images/ {
                    expires 5s;
                    root /usr/share/nginx/html;
                    try_files $uri /images/placeholder.jpg;
                }
                location /api/catalogue/ { proxy_pass http://catalogue:8080/; }
                location /api/user/ { proxy_pass http://user:8080/; }
                location /api/cart/ { proxy_pass http://cart:8080/; }
                location /api/shipping/ { proxy_pass http://shipping:8080/; }
                location /api/payment/ { proxy_pass http://payment:8080/; }

                location /health {
                    stub_status on;
                    access_log off;
                }
            } 
        }
---
apiVersion: apps/v1
kind: deployment
metadata: 
    name: frontend
    namespace: roboshop  # name space where the pod is going to be created
    # these are replica-set labels. 
    labels: 
        project: roboshop 
        component: frontend 
        environment: dev
        tier: frontend 
        purpose: deployment
spec:
    replicas: 1
    selector:
        #This is used to select the pods and create the replicaset for those pods. 
        matchLabels:
            project: roboshop 
            component: frontend 
            environment: dev
            tier: frontend   
            purpose: deployment
    # pod defination  
    template: 
        metadata: 
            labels:
                project: roboshop 
                component: frontend 
                environment: dev
                tier: frontend   
                purpose: deployment
        spec: 
            containers: 
            - name: frontend 
              image: joindevops/frontend:v1  # it should be there in our docker hub
              imagePullPolicy: Always
              ports:
                - name: liveness-port
                  containerPort: 8080
              resources:
                requests:
                    cpu: "100m"
                    memory: "128Mi"
                limits:
                    cpu: "100m"
                    memory: "128Mi"   
              readinessProbe:
                httpGet:
                    port: liveness-port
                    path: /
                initialDelaySeconds: 10
                periodSeconds: 5
                failureThreshold: 2
                successThreshold: 1 
              livenessProbe:
                httpGet:
                    port: liveness-port
                    path: /
                initialDelaySeconds: 8
                periodSeconds: 4
                failureThreshold: 2
                successThreshold: 1 
              volumemounts:
                - name: nginx-config
                  mountPath: /etc/nginx/nginx.conf
                  subPath: nginx.conf
            volumes:
            - name: nginx-config
              configMap:
                name: frontend
---
#Creating a service 
apiVersion: v1
kind: service
metadata: 
    name: frontend
    namespace: roboshop  # name space where the pod is going to be created
    # these are service labels. 
spec:
    type: LoadBalancer
    selector: 
        project: roboshop 
        component: frontend 
        environment: dev
        tier: frontend
        purpose: service
    ports:
        - protocol: TCP 
          port: 80 #service port, which can be anything
          targetPort: 8080 #pod port, which should match the container port
---
# horizontal pod autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodSutoscaler
metadata:
    name: frontend
    namespace: roboshop
    lables:
        project: roboshop 
        component: frontend 
        environment: dev
        tier: frontend
        purpose: service
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: frontend
    minReplicas: 1
    maxReplicas: 10
    metrics:
    - type: Resource
      resoure:
        name: cpu
        target:
            type: Utilization
            averageUtilization: 5  # In real projects upto 70