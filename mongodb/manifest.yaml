#service, headless service, statefulset, pvc
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: mongodb
    tier: db
  ports:
    - protocol: TCP
      port: 27017 #service port
      targetPort: 27017 #container port
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: roboshop
spec:
  clusterIP: None
  selector:
    project: roboshop
    component: mongodb
    tier: db
  ports:
    - protocol: TCP
      port: 27017 #service port
      targetPort: 27017 #container port
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: roboshop
spec:
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      tier: db
  serviceName: "mongodb-headless"  #this should be headless service name
  replicas: 2 # by default it will be 1
  template: 
    metadata:
      lables:
        project: roboshop
        component: mongodb
        tier: db
    spec:
      containers:
      - name: mongodb
        image: joindevops/mongodb:v1
        volumeMounts:
        - name: mongodb
          mountPath: /data/db
  # pvc
  volumeClaimTemplets:
  - metadta : 
      name : mongodb
    spec:
      acessModes: [ "ReadWriteOnce" ]
      storageclass: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi

      